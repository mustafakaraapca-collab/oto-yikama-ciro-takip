 .hero-copy strong{font-size:clamp(22px,6vw,27px)!important;margin-bottom:5px!important}
 .hero-copy p{font-size:11px!important;line-height:1.5!important}
 .package-picker{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
 .package-choice,.package-choice:last-child:nth-child(odd){min-height:114px!important;padding:10px 8px 8px!important}
 .package-choice .pkg-icon{width:23px!important;height:23px!important;margin-bottom:5px!important}
 .package-choice .pkg-name{font-size:clamp(14px,4vw,17px)!important}
 .package-choice .pkg-price{font-size:clamp(17px,4.4vw,20px)!important}
 .package-choice .pkg-state{font-size:7px!important}
 .package-choice .pkg-sub{font-size:8px!important}
 .package-picker-head strong{font-size:15px!important}
 .package-picker-head span{font-size:9px!important;max-width:132px!important}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}
 .grid>.field:nth-child(1),.grid>.field:nth-child(2),.grid>.field:nth-child(5),.grid>.wide{grid-column:1/-1!important}
 .grid>.field:nth-child(3),.grid>.field:nth-child(4){grid-column:auto!important}
 .field label,.wide>label,.status-grid label{font-size:10px!important}
 .date-quick{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:4px!important}
 .date-pill{min-height:48px!important;min-width:0!important;white-space:normal!important;font-size:9px!important}
 .times{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important}
 .sectioncap{font-size:16px!important}
 .quick-title{font-size:15px!important}
}
@media(max-width:360px){
 .grid{grid-template-columns:1fr!important}
 .grid>.field{grid-column:1/-1!important}
 .package-choice,.package-choice:last-child:nth-child(odd){padding:9px 6px!important}
 .package-choice .pkg-name{font-size:13px!important}
 .package-choice .pkg-price{font-size:16px!important}
 .package-choice .pkg-state{font-size:7px!important}
 .package-choice .pkg-sub{font-size:8px!important}
 .date-quick{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}
 .times{grid-template-columns:repeat(3,minmax(0,1fr))!important}
 .date-pill{min-height:45px!important}
}
</script>
<script>
(()=>{
'use strict';
const frame=document.getElementById('existingBooking');
let doc,box,observer;
const styles=document.getElementById('ruva-brand-css').textContent;
let lastHeight=0;
function measure(){
 if(!doc||!box)return;
 const h=Math.ceil(box.getBoundingClientRect().height+4);
 if(h<100||!Number.isFinite(h))return;
 if(h!==lastHeight){lastHeight=h;frame.style.height=h+'px';}
 try{window.parent.postMessage({type:'ruva:booking-height',height:Math.ceil(document.documentElement.scrollHeight)+2},'*')}catch(e){}
}
function applyTheme(){
 try{
  doc=frame.contentDocument;
  if(!doc||!doc.head||!doc.body)throw Error('Randevu formuna erişilemedi.');
  if(!doc.getElementById('ruvaCorporateTheme')){
    const style=doc.createElement('style');style.id='ruvaCorporateTheme';style.textContent=styles;doc.head.appendChild(style);
  }
  const heading=doc.querySelector('.hero-copy strong');
  if(heading)heading.textContent='RANDEVUNUZU OLUŞTURUN';
  const info=doc.querySelector('.hero-copy p');
  if(info)info.textContent='Paketinizi, gününüzü ve saatinizi seçin. Talebiniz işletme onayından sonra kesinleşir.';
  const footerText=doc.querySelector('.footerline');
  if(footerText)footerText.textContent='RUVA · İlk Günkü Heyecan';
  // V5: details are collapsed by default but remain accessible, including live vehicle price matrix.
  const detailPanel=doc.getElementById('serviceDetails');
  const packagePicker=doc.getElementById('packagePicker');
  if(detailPanel && !doc.getElementById('ruvaDetailToggle')){
    const toggle=doc.createElement('button');
    toggle.type='button';toggle.id='ruvaDetailToggle';toggle.className='ruva-detail-toggle';
    toggle.setAttribute('aria-controls','serviceDetails');
    toggle.setAttribute('aria-expanded','false');
    toggle.textContent='PAKET İÇERİĞİ VE ARAÇ FİYATLARINI GÖR';
    detailPanel.parentNode.insertBefore(toggle,detailPanel);
    const sync=()=>{toggle.hidden=!detailPanel.classList.contains('show');};
    const detailObserver=new MutationObserver(sync);
    detailObserver.observe(detailPanel,{attributes:true,attributeFilter:['class']});
    sync();
    toggle.addEventListener('click',()=>{
      const expanded=detailPanel.classList.toggle('ruva-expanded');
      toggle.setAttribute('aria-expanded',String(expanded));
      toggle.textContent=expanded?'PAKET DETAYLARINI GİZLE':'PAKET İÇERİĞİ VE ARAÇ FİYATLARINI GÖR';
      requestAnimationFrame(measure);
    });
    if(packagePicker)packagePicker.addEventListener('click',(event)=>{
      if(event.target.closest('.package-choice')){
        detailPanel.classList.remove('ruva-expanded');
        toggle.setAttribute('aria-expanded','false');
        toggle.textContent='PAKET İÇERİĞİ VE ARAÇ FİYATLARINI GÖR';
      }
    },true);
  }
  box=doc.querySelector('body > .wrap') || doc.body;
  if(observer)observer.disconnect();
  if('ResizeObserver' in window){observer=new ResizeObserver(()=>requestAnimationFrame(measure));observer.observe(box)}
  measure();setTimeout(measure,350);setTimeout(measure,1000);setTimeout(measure,3500);
 }catch(e){
  document.getElementById('fail').style.display='block';
  console.error('RUVA tema yüklenemedi:',e);
 }
}
frame.addEventListener('load',applyTheme);
// Recovery for cached iframes where load completed before this listener was attached.
function ensureTheme(){
  try{
    const inner=frame.contentDocument;
    if(inner && inner.readyState==='complete' && inner.body && !inner.getElementById('ruvaCorporateTheme')) applyTheme();
  }catch(e){}
}
ensureTheme();
requestAnimationFrame(ensureTheme);
setTimeout(ensureTheme,250);
setTimeout(ensureTheme,1000);
window.addEventListener('resize',()=>requestAnimationFrame(measure),{passive:true});
})();
</script>
</body></html>
