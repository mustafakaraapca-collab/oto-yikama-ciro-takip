body{font-family:'Montserrat',Arial,sans-serif!important;background:radial-gradient(ellipse at 85% 1%,rgba(206,161,92,.075),transparent 40%),#090b0d!important;-webkit-font-smoothing:antialiased}

.date-pill.active{background:linear-gradient(115deg,#a77b43,#e5bd80)!important;border-color:#d4a768!important;color:#15110d!important}

.timebtn:hover:not(:disabled){border-color:#cd9f5e!important}

.summary{background:#15191b!important;border:1px solid rgba(220,183,123,.20)!important;border-radius:4px!important;padding:12px!important}

.sumrow span{color:#b9b3ab!important}

.note,.cta-note{font-size:12px!important;line-height:1.7!important;color:#b9b3aa!important}
.cta-note b{color:#e5c38d!important}

.primary{min-height:60px!important;background:linear-gradient(108deg,#a77a3e,#e7bf83,#b18348)!important;color:#18130d!important;border:1px solid #e3bb7e!important;font-size:17px!important;box-shadow:0 12px 28px rgba(0,0,0,.15)!important}
.primary:disabled{opacity:.50!important;cursor:not-allowed!important}
#statusBtn{background:transparent!important;border:1px solid rgba(229,183,113,.62)!important;color:#e9c48c!important;font-size:12px!important;min-height:50px!important;padding:13px 15px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;white-space:normal!important}
.status-head h2{font:700 22px 'Oxanium',Arial,sans-serif!important;text-transform:uppercase!important;letter-spacing:.05em!important;color:#f4eee4!important}
.status-result{background:#1a1e21!important;border:1px solid rgba(216,172,104,.20)!important;color:#f3eee7!important;border-radius:4px!important}
.status-result .status-title,.status-title{font:700 18px 'Oxanium',Arial,sans-serif!important;color:#e7c38c!important}
.status-detail{color:#c7c0b7!important;font-size:12px!important;line-height:1.75!important}
.msg{color:#f1ebe2!important;font-size:13px!important}
.footerline{font-family:'Oxanium',Arial,sans-serif!important;letter-spacing:.20em!important;text-transform:uppercase!important;color:#b49a71!important;font-size:11px!important}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e8bd7f!important;outline-offset:3px!important}
@media(max-width:650px){
 .wrap{padding:12px 13px 40px!important}
 .hero{padding:20px 18px 22px!important;margin-bottom:25px!important}
 .brandrow{min-height:58px!important}.ruva-exact-logo{width:min(100%,292px)!important}
 .hero-copy{margin-top:15px!important}.hero-copy strong{font-size:27px!important}.hero-copy p{font-size:12px!important}
 .carline{width:135px!important;opacity:.055!important}
 .grid{grid-template-columns:1fr!important;gap:14px!important}

 .package-choice:last-child:nth-child(odd){grid-column:1/-1;min-height:125px!important}
 .package-choice .pkg-name{font-size:21px!important}.package-choice .pkg-price{font-size:24px!important}
 .detail-body{padding:16px!important}.service-details-grid{grid-template-columns:1fr!important}
 .detail-visual{min-height:136px!important}.detail-visual svg{top:12px!important;left:16px!important}.detail-badge{width:37px!important;height:37px!important;left:auto!important;right:15px!important}

 .date-pill{min-height:56px!important}.times{grid-template-columns:repeat(3,minmax(0,1fr))!important}
 .package-picker-head span{font-size:10px!important;max-width:130px!important}
 .sectioncap{font-size:18px!important}.quick-title{font-size:17px!important}
}
@media(max-width:365px){.package-picker{grid-template-columns:1fr!important}.package-choice{min-height:128px!important}.package-choice:last-child:nth-child(odd){grid-column:auto!important}.hero-copy strong{font-size:24px!important}.date-quick{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(prefers-reduced-motion:reduce){.package-choice{transition:none!important}}
</script>

let doc,box,observer;
const styles=document.getElementById('ruva-brand-css').textContent;
let lastHeight=0;
function measure(){
 if(!doc||!box)return;
 const h=Math.ceil(box.getBoundingClientRect().height+4);
 if(h<100||!Number.isFinite(h))return;
 if(h!==lastHeight){lastHeight=h;frame.style.height=h+'px';}
 try{window.parent.postMessage({type:'ruva:booking-height',height:Math.ceil(document.documentElement.scrollHeight)+2},'*')}catch(e){}
}
function applyTheme(){
 try{
  doc=frame.contentDocument;
  if(!doc||!doc.head||!doc.body)throw Error('Randevu formuna erişilemedi.');
  if(!doc.getElementById('ruvaCorporateTheme')){
    const style=doc.createElement('style');style.id='ruvaCorporateTheme';style.textContent=styles;doc.head.appendChild(style);
  }
  const brand=doc.querySelector('.brandrow');
  if(brand&&!brand.querySelector('.ruva-exact-logo')){
    const img=doc.createElement('img');img.className='ruva-exact-logo';img.src=logo;img.alt='RUVA Detailing';img.decoding='async';brand.appendChild(img);img.addEventListener('load',measure,{once:true});
  }
  const heading=doc.querySelector('.hero-copy strong');
  if(heading)heading.textContent='ONLINE RANDEVU';
  const info=doc.querySelector('.hero-copy p');
  if(info)info.textContent='Aracınız için doğru paketi ve uygun zamanı seçin. Randevu talebinizi birkaç adımda tamamlayın.';
  box=doc.querySelector('body > .wrap') || doc.body;
  if(observer)observer.disconnect();
  if('ResizeObserver' in window){observer=new ResizeObserver(()=>requestAnimationFrame(measure));observer.observe(box)}
  measure();setTimeout(measure,350);setTimeout(measure,1000);setTimeout(measure,3500);
 }catch(e){
  document.getElementById('fail').style.display='block';
  console.error('RUVA tema yüklenemedi:',e);
 }
}
frame.addEventListener('load',applyTheme);
window.addEventListener('resize',()=>requestAnimationFrame(measure),{passive:true});
})();
